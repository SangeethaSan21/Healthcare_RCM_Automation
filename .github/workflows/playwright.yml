name: MaxtonRCM - Deploy and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-app:
    name: Deploy dummy app to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload app to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Wait for Pages to be live
        run: sleep 10
      - name: Run Smoke Tests
        env:
          BASE_URL: ${{ needs.deploy-app.outputs.page_url }}
        run: |
          echo "Testing against: $BASE_URL"
          npx playwright test --grep @smoke
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: reports/html/
          retention-days: 7

  regression-tests:
    name: Regression & E2E Tests
    runs-on: ubuntu-latest
    needs: [deploy-app, smoke-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Regression Tests
        env:
          BASE_URL: ${{ needs.deploy-app.outputs.page_url }}
        run: |
          echo "Testing against: $BASE_URL"
          npx playwright test --grep "@regression|@e2e"
      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: reports/html/
          retention-days: 14
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: reports/junit/